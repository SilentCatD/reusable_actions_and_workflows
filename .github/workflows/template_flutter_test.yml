name: Template flutter test

on:
  workflow_call:
    inputs:
      working-dir:
        type: string
        description: "Working dir"
        default: .
      should-call-code-cov:
        type: boolean
        default: true
        description: "Should perform uploading coverage test to codecov"
    secrets:
      code_cov_token:

jobs:
  flutterTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: SilentCatD/reusable_actions_and_workflows/.github/actions/setup_flutter_action@main

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get
        working-directory: ${{ inputs.working-dir }}


      - name: Analyze changed files
        run: flutter analyze --no-fatal-infos --write=flutter_analyze.log

      - name: Run Flutter Test
        working-directory: ${{ inputs.working-dir }}
        run: flutter test --coverage
  
      - name: Upload coverage reports to Codecov
        if: ${{ inputs.should-call-code-cov }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.code_cov_token }}